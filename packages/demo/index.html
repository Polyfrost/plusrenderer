<!doctype html>
<meta charset="utf-8">
<title>plusrenderer (WebGL2)</title>
<style>
    :root { color-scheme: dark; }
    body {
        margin: 0; min-height: 100vh; display: flex; gap: 24px;
        align-items: center; justify-content: center; flex-wrap: wrap;
        background: #16171a; color: #d8d9de;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    body.dragging canvas { outline: 2px dashed #7aa2f7; outline-offset: 4px; }
    canvas {
        width: 420px; height: 480px;
        background: #202225; border-radius: 10px; touch-action: none;
    }
    .panel { display: grid; gap: 10px; width: 300px; }
    h2 { margin: 6px 0 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #8b8d96; }
    label { display: grid; gap: 3px; }
    label span { color: #8b8d96; font-size: 11px; }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .row label { display: flex; gap: 6px; align-items: center; }
    input[type=range] { width: 100%; }
    button, .upload {
        font: inherit; color: inherit; background: #2a2c31; border: 1px solid #3a3d44;
        border-radius: 6px; padding: 2px 10px; cursor: pointer;
    }
    .upload input { display: none; }
    .cosmetics { display: grid; gap: 4px; }
    .cosmetic { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
    .cosmetic .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cosmetic select { font: inherit; font-size: 11px; background: #2a2c31; color: inherit; border: 1px solid #3a3d44; border-radius: 4px; }
    .cosmetic button { padding: 0 6px; }
    .hint { color: #8b8d96; font-size: 11px; }
    #stats { color: #8b8d96; font-variant-numeric: tabular-nums; }
    #error { color: #ff8080; white-space: pre-wrap; }
</style>

<canvas id="view"></canvas>

<div class="panel">
    <label><span>yaw</span><input id="yaw" type="range" min="-180" max="180" value="0"></label>
    <label><span>pitch</span><input id="pitch" type="range" min="-90" max="90" value="8"></label>
    <label><span>distance</span><input id="distance" type="range" min="25" max="160" value="70"></label>
    <label><span>light level</span><input id="light" type="range" min="0" max="15" value="15"></label>
    <div class="row"><label><input id="spin" type="checkbox"> spin</label></div>

    <h2>Player</h2>
    <div class="row">
        <label><input id="slim" type="checkbox"> slim</label>
        <label class="upload">skin…<input id="skin-file" type="file" accept=".png,image/png"></label>
    </div>

    <h2>Emote</h2>
    <div class="row">
        <label><input id="emote" type="checkbox" checked> play</label>
        <label class="upload">emote…<input id="emote-file" type="file" accept=".json,.zip"></label>
        <span id="emote-name" class="hint"></span>
    </div>

    <h2>Cape</h2>
    <div class="row">
        <label><input id="cape" type="checkbox"> show</label>
        <label class="upload">cape…<input id="cape-file" type="file" accept=".png,.sheet,.zip" multiple></label>
        <span id="cape-name" class="hint"></span>
    </div>

    <h2>Cosmetics</h2>
    <div id="cosmetics" class="cosmetics"></div>
    <div class="row">
        <label class="upload">add bundle…<input id="bundle-file" type="file" accept=".zip,.json,.png" multiple></label>
    </div>
    <div class="hint">Drop a bundle (.zip, or .geo.json + .png), an emote, a cape or a skin anywhere.</div>

    <div id="stats"></div>
    <div id="error"></div>
</div>

<script type="module" src="/src/main.js"></script>
