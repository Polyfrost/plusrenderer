[package]
name = "plusrenderer"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = { version = "1.5.2", default-features = false }
libm = "0.2.16"
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
png = "0.18.1"
schemars = { version = "1.2.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
