[workspace]
resolver = "2"
members = ["crates/core", "crates/ffi", "crates/skia"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The native library loads into other processes (the game), where a panic
# must unwind to `guarded` and fail one call instead of aborting the host.
[profile.native]
inherits = "release"
panic = "unwind"
# Not size: per-frame speed in the game matters more (mesh builds ~2.5x faster than at "s").
opt-level = 3

[profile.wasm]
inherits = "release"
opt-level = "z"
