name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            # The scripts call `cargo +1.97`.
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.97"
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            - run: cargo +1.97 test -p plusrenderer -p plusrenderer-ffi
            - run: scripts/build-wasm.sh
            - run: scripts/build-native.sh target/java-resources
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  # 8 runs the tests, 21 runs Gradle.
                  java-version: |
                      8
                      21
            - uses: gradle/actions/setup-gradle@v4
            - run: ./gradlew test
              working-directory: java
